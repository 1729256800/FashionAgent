<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时尚推荐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 20px;
            color: #333;
        }

        /* 轮播图：确保1:1比例 */
        .slider {
            position: relative;
            width: 100%;
            max-width: 300px; /* 设定最大宽度 */
            aspect-ratio: 1 / 1; /* 保持1:1比例 */
            overflow: hidden;
            border-radius: 12px;
            margin: 0 auto 20px;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slides {
            display: flex;
            width: 500%;
            animation: slideAnimation 10s infinite linear;
            align-items: center;
        }

        .slide {
            width: 100%;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 保证完整显示，不裁剪 */
            border-radius: 12px;
        }

        /* 按钮样式 */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            transition: all 0.3s ease-in-out;
        }

        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(to right, #0056b3, #003f7f);
        }

        .loading {
            display: none;
            font-size: 18px;
            margin-top: 15px;
            color: #666;
        }

        /* 轮播图动画 */
        @keyframes slideAnimation {
            0% { transform: translateX(0%); }
            20% { transform: translateX(0%); }
            25% { transform: translateX(-100%); }
            45% { transform: translateX(-100%); }
            50% { transform: translateX(-200%); }
            70% { transform: translateX(-200%); }
            75% { transform: translateX(-300%); }
            95% { transform: translateX(-300%); }
            100% { transform: translateX(-400%); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>时尚推荐</h1>

        <!-- 轮播图 -->
        <div class="slider">
            <div class="slides">
                <div class="slide"><img src="{{ url_for('static', filename='images/fashion1.png') }}" alt="时尚1"></div>
                <div class="slide"><img src="{{ url_for('static', filename='images/fashion2.png') }}" alt="时尚2"></div>
                <div class="slide"><img src="{{ url_for('static', filename='images/fashion3.png') }}" alt="时尚3"></div>
                <div class="slide"><img src="{{ url_for('static', filename='images/fashion4.png') }}" alt="时尚4"></div>
                <div class="slide"><img src="{{ url_for('static', filename='images/fashion5.png') }}" alt="时尚5"></div>
            </div>
        </div>

        <input type="text" id="require" placeholder="请输入您的需求，例如：女生推荐">
        <button onclick="submitRequire()">提交</button>
        <div class="loading" id="loading">正在生成，请稍候...</div>
    </div>

    <script>
        async function submitRequire() {
            const require = document.getElementById("require").value;
            if (!require) {
                alert("请输入需求！");
                return;
            }

            document.getElementById("loading").style.display = "block";

            try {
                const response = await fetch("/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ require }),
                });

                const data = await response.json();
                if (!data.image_url || !data.content) {
                    throw new Error("数据不完整");
                }

                const resultPageUrl = `/result?image_url=${encodeURIComponent(data.image_url)}&content=${encodeURIComponent(data.content)}`;

                // 跳转到新的页面显示结果
                window.location.href = resultPageUrl;
            } catch (error) {
                alert("请求失败，请稍后重试！");
                console.error(error);
            } finally {
                document.getElementById("loading").style.display = "none";
            }
        }
    </script>

</body>
</html>
